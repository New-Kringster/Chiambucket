<body>

            <h1 class="ct-title">Let's <em>talk.</em></h1>

            <div class="ct-email-card">

                    <span class="ct-email-label">Email</span>
                    <span class="ct-email-addr" id="ct-email">braven@chiambucket.com</span>
                </div>
                <div class="ct-email-actions">
                    <a class="ct-copy" href="mailto:braven@chiambucket.com">
                        <svg viewBox="0 0 24 24" fill="none" width="16" height="16" aria-hidden="true">
                            <rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.8"/>
                            <path d="M4 7l8 6 8-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                        </svg>
                        Email me
                    </a>
                    <button class="ct-copy" type="button" onclick="copyEmail(this)">
                        <svg viewBox="0 0 24 24" fill="none" width="16" height="16" aria-hidden="true">
                            <rect x="9" y="9" width="11" height="11" rx="2" stroke="currentColor" stroke-width="1.8"/>

                    Instagram
                </a>
                <a class="ct-social" href="https://www.youtube.com/@newkringster2564" target="_blank" rel="noopener">
                    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="3.5" stroke="#e62117" stroke-width="1.8"/><path d="M10.5 9.5l4.5 2.5-4.5 2.5z" fill="#e62117"/></svg>

    </main>

    <script>
        function copyEmail(btn) {
            const email = "braven@chiambucket.com";
            const label = btn.querySelector(".ct-copy-label");
            const done = () => { if (label) { const o = label.textContent; label.textContent = "Copied!"; setTimeout(() => label.textContent = o, 1600); } };
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(email).then(done).catch(done);
            } else {
                const t = document.createElement("textarea"); t.value = email; document.body.appendChild(t); t.select();
                try { document.execCommand("copy"); } catch (e) {}
                document.body.removeChild(t); done();
            }
        }
    </script>
</body>
