          - heading "Control & Telemetry System" [level=2] [ref=e237]
          - paragraph [ref=e238]: The control and telemetry system feeds sensor data to the client using an MQTT topic that the client is subscribed to. Another MQTT topic is used by the client to send movement and command messages back to the ESP32.
          - img "Control and telemetry diagram" [ref=e239]
          - heading "Signalling" [level=3] [ref=e240]
          - paragraph [ref=e241]: Because of an issue that has not yet been resolved, all sensor data could not be sent together in a single MQTT transmission. Instead, the data was divided into three separate packets and transmitted individually at approximately 10 Hz.
