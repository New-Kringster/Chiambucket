<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Safari bar test</title>
<!-- A temporary test page: which colour does Safari on iPhone put in its status bar and toolbar?
     No pinned elements, the page's own colour is grey, and the bands are red / black / white / blue.
     ?mixed splits the top band into red and blue halves. -->
<style>
  html { background: #555; }
  body { margin: 0; font: 600 18px/1.4 -apple-system, system-ui, sans-serif; color: #fff; }
  .band { height: 120vh; display: grid; place-items: center; text-align: center; }
  .top { height: 60vh; background: #e01b24; }
  html.mixed .top { background: linear-gradient(90deg, #e01b24 50%, #1c5bd8 50%); }
  .black { background: #000; }
  .white { background: #fff; color: #000; }
  .blue { background: #1c5bd8; }
  .card { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 70vw; padding: 14px; border-radius: 16px; background: rgba(0,0,0,.6); color: #fff; font-size: 15px; text-align: center; }
  .card button { font: inherit; margin-top: 8px; padding: 10px 14px; border-radius: 10px; border: 0; background: #fff; color: #000; }
  .wrap { position: relative; }
</style>
<script>if (location.search.indexOf('mixed') >= 0) document.documentElement.classList.add('mixed');</script>
</head>
<body>
  <div class="band top"><p>Top band, <span id="kind"></span></p></div>
  <div class="band black wrap">Black band
    <div class="card">The page's own colour is grey.<br><button id="b">Make the page's colour pink</button></div>
  </div>
  <div class="band white">White band</div>
  <div class="band blue">Blue band</div>
  <script>
    document.getElementById('kind').textContent = document.documentElement.classList.contains('mixed') ? 'red and blue halves' : 'all red';
    var b = document.getElementById('b'), pink = false;
    b.onclick = function () { pink = !pink; document.documentElement.style.background = pink ? '#ff2fa8' : ''; b.textContent = pink ? 'Make the page’s colour grey' : 'Make the page’s colour pink'; };
  </script>
</body>
</html>
