<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src='https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js'></script>
    <script type="module">
        import { Application } from 'https://unpkg.com/@splinetool/runtime@1.10.26/build/runtime.js';
        import { Easing } from 'https://unpkg.com/@splinetool/runtime@1.10.26/build/runtime.js';
        const canvas = document.getElementById('canvas3d');
        const spline = new Application(canvas);
        spline.load('https://prod.spline.design/vxkBuoco9z0MCcp7/scene.splinecode').then(() => {
            const sphere = spline.findObjectById("a4d95386-7c30-4192-ae34-ac237fae3cf1");
            const obj = spline.findObjectById('Cube');
            function thehook() {
                sphere.transition({
                from: undefined, // State name to start from, undefined will start from current state
                to: 'State', // State name to go to, null will go to base state
                duration: 1000, // in ms
                delay: 0, // in ms
                easing: Easing.EASE,
                autoplay: true
                });
            }
            window.thehook = thehook;
        })
    </script>
</head>
<body>
    <button onclick="thehook()">Test</button>
    <canvas id="canvas3d"></canvas>
    <h1>
    </h1>
</body>
</html>
