<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        body {
            background-image: url(images/abm-lr.jpg);
            background-size: cover;
            background-repeat: no-repeat;
            height: 200vh;
            width: 100%;
        }
        /* From Here */
        #chiambucket-banner {
            position: sticky;
            top: 10px;
            left: 10px;
            z-index: 999999;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-radius: 999px;
            box-sizing: border-box;
            background: linear-gradient(90deg, #1f1f1f, #2b2b2b);
            color: #f3f3f3;
            border-bottom: 1px solid #444;
            box-shadow: 0 4px 18px rgba(0,0,0,0.25);
            font-family: Arial, sans-serif;
            transition: 500ms ease;
            overflow: hidden;
        }

        #chiambucket-banner:hover {
            width: 300px;
        }

        #chiambucket-banner:hover #chiambucket-banner-close {
            display: block;
        }
        #chiambucket-banner:hover #chiambucket-banner-inside a{
            color: #f3f3f3;
            text-decoration: none;
            font-size: 0.8rem;
            transition: 500ms ease;
            font-family: Arial, Helvetica, sans-serif;
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            transition-delay: 0.25s, 0.25s;
        }  
        #chiambucket-banner:hover #chiambucket-banner-inside {
            width: unset;
        }
        #chiambucket-banner-inner {
            position: relative;
            padding: 5px 10px;
            text-align: center;
            display: flex;
            flex-direction: row-reverse;
            align-items: center;
            justify-content: space-between;
            font-size: 14px;
            width: 100%;
        }
        #chiambucket-banner-inner img {
            width: 30px;
        }
        #chiambucket-banner-inside {
            width: 0;
        }
        #chiambucket-banner-inside a {
            color: #f3f3f3;
            border-radius: 36px;
            background: linear-gradient(175deg, rgb(78, 77, 77) 0%, rgb(65, 64, 64) 100%);
            border-top: 1px solid #636363;
            border-left: 1px solid #636363;
            padding: 5px 10px;
            opacity: 0;
            width: 0;
            visibility: hidden;
            pointer-events: none;
            transition:
            opacity 0.2s ease,
            visibility 0s linear 0.5s;
        }
    
        #chiambucket-banner-close {
            display: none;
            background: none;
            border: none;
            color: #f3f3f3;
            font-size: 20px;
            cursor: pointer;
            line-height: 1;
            padding-left: 10px;
        }
    
        #chiambucket-banner-close:hover {
            opacity: 0.75;
        }
        /* To Here */
    </style>
</head>
<body>
    <div id="chiambucket-banner">
        <!--From Here-->
        <div id="chiambucket-banner-inner">
            <img src="https://www.chiambucket.com/images/logo.png" alt="">
            <div id="chiambucket-banner-inside">
                <a href="https://www.chiambucket.com">Visit Chiambucket</a>
            </div>
            <button id="chiambucket-banner-close" type="button" aria-label="Close banner">
              &times;
            </button>
        </div>
        <!--To Here-->
    </div>
</body>
</html>
