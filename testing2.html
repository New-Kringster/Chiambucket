<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scrollspy Chapters</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
    }

    .article-chapter-wrapper {
      position: sticky;
      top: 0;
      width: 220px;
      height: 100vh;
      padding: 20px;
      background: #111;
      color: white;
      box-sizing: border-box;
    }

    .article-chapter-wrapper h2 {
      margin-top: 0;
      font-size: 20px;
    }

    .article-chapter-wrapper a {
      display: block;
      color: #aaa;
      text-decoration: none;
      margin: 12px 0;
      transition: 0.2s;
    }

    .article-chapter-wrapper a.active {
      color: white;
      font-weight: bold;
      padding-left: 10px;
      border-left: 3px solid white;
    }

    .content {
      flex: 1;
      padding: 40px;
      max-width: 900px;
    }

    section {
      min-height: 100vh;
      padding: 40px 0;
      border-bottom: 1px solid #ddd;
    }

    section h1 {
      margin-top: 0;
    }
  </style>
</head>
<body>
  <nav class="article-chapter-wrapper">
    <h2>Chapters</h2>
    <a href="#chapter1">Chapter 1</a>
    <a href="#chapter2">Chapter 2</a>
    <a href="#chapter3">Chapter 3</a>
    <a href="#chapter4">Chapter 4</a>
  </nav>

  <main class="content">
    <section id="chapter1">
      <h1>Chapter 1</h1>
      <p>Content for chapter 1...</p>
    </section>

    <section id="chapter2">
      <h1>Chapter 2</h1>
      <p>Content for chapter 2...</p>
    </section>

    <section id="chapter3">
      <h1>Chapter 3</h1>
      <p>Content for chapter 3...</p>
    </section>

    <section id="chapter4">
      <h1>Chapter 4</h1>
      <p>Content for chapter 4...</p>
    </section>
  </main>

  <script>
    const sections = document.querySelectorAll("section");
    const navLinks = document.querySelectorAll(".article-chapter-wrapper a");
    console.log(sections);
    console.log(navLinks);


    const observer = new IntersectionObserver(
      (entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            navLinks.forEach((link) => link.classList.remove("active"));
            console.log(entry);

            const activeLink = document.querySelector(
              `.article-chapter-wrapper a[href="#${entry.target.id}"]`
            );

            if (activeLink) {
              activeLink.classList.add("active");
            }
          }
        });
      },
      {
        threshold: 0.5
      }
    );

    sections.forEach((section) => observer.observe(section));
  </script>
</body>
</html>
